<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeBravara - Pokédex</title>
    
    
    <link rel="stylesheet" href="pokedex.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="game.css">
</head>
<body class="game-page" data-page="pokedex">
    <p id="page-feedback" class="page-feedback error" role="alert" hidden><span></span> <a class="back-button" href="menu.html">Voltar ao menu</a></p>
<header>
    <div class="header-top">
        <div id="tabs-container">
            <button id="btn-tab-pokedex" class="tab-btn active">Pokédex</button>
            <button id="btn-tab-iniciais" class="tab-btn">Iniciais</button>
        </div>
    </div>
    <div class="header-bottom">
        <h1>Pokédex</h1>
        <div id="search-container" class="hidden">
        <input type="number" id="search-input" aria-label="Número do Pokémon" placeholder="Buscar por número..." min="1">
        <img id="search-preview" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" alt="Preview">
        <button id="search-btn">Buscar</button>
    </div>
        <div id="filter-container" class="filter-bar">
            <input type="search" id="filter-input" aria-label="Filtrar por nome ou número" placeholder="Filtrar por nome ou nº…" autocomplete="off">
            <div id="status-filters" role="group" aria-label="Filtrar por status">
                <button type="button" class="chip active" data-status="all" aria-pressed="true">Todos</button>
                <button type="button" class="chip" data-status="captured" aria-pressed="false">Capturados</button>
                <button type="button" class="chip" data-status="sighted" aria-pressed="false">Avistados</button>
            </div>
            <p id="dex-counter" class="dex-counter" aria-live="polite"></p>
        </div>
    </div>
</header>

        <main id="pokedex-grid">
            </main>
        
        <div id="spinner" class="spinner-container">
            <div class="spinner"></div>
            <p>Carregando Pokédex…</p>
        </div>

<div id="interaction-modal" class="modal-overlay hidden" aria-labelledby="modal-pokemon-name">
    <div class="modal-content">
        <button class="interaction-close-btn" aria-label="Fechar">&times;</button>
        <img id="modal-interaction-image" src="" alt="Pokémon" class="modal-pokemon-image">
        <h2 id="modal-pokemon-name"></h2>
        <p>O que você deseja fazer?</p>
        <div class="modal-buttons">
            <button id="btn-avistar">Avistar</button>
            <button id="btn-capturar">Capturar</button>
        </div>
    </div>
</div>
    
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
   <div id="details-modal" class="modal-overlay hidden" aria-labelledby="details-name">
    <div id="details-modal-content" class="modal-content">
        <button id="details-close-btn" class="close-btn" aria-label="Fechar">&times;</button>
        <div class="details-view">
            <img id="details-image" src="" alt="Imagem do Pokémon">
            <div class="details-info">
                <p id="details-number" class="pokemon-number"></p>
                <h2 id="details-name" class="pokemon-name"></h2>
                <div id="details-types" class="pokemon-types"></div>
                <p id="details-desc"></p>
                <div id="details-stats" class="stats-container">
                    </div>
            </div>
        </div>
    </div>
</div>
<script defer src="database.js"></script>
    <script defer src="utils.js"></script>
    <script defer src="firebase-config.js"></script>
    <script defer src="toast.js"></script>
    <script defer src="nav.js"></script>
    <script defer src="game-ui.js"></script>
    <script defer src="pokedex.js"></script>
</body>
